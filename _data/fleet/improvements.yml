  # --- loop-tuner 2026-10-19: the measure + memory read what actually happened ---
  # (1) A `runs.fail_rate` trend regression (2.7 -> 5.4) fired. 6 of the 8
  # "failures" in the window were `cancelled` runs (pipeline x2, Pages deploy x3,
  # CI x1) — runs superseded by a `concurrency:` group or Pages' own deploy
  # queue, i.e. the loop working as designed. loop_metrics counted any
  # non-success conclusion as a failure, so every concurrency guard a past run
  # added showed up as a fail-rate regression. Fixed in the measure: cancelled
  # runs reached no verdict and are excluded (normalize_runs). Same window,
  # corrected: 2 real failures / 143 runs = 1.4%. No check, gate, or workflow
  # touched. (2) verify_improvements could not dig an array metric, so every
  # `recurring_findings` claim (2026-08-10, 2026-10-12) could only ever read
  # "pending". dig_path now addresses `recurring_findings.<rule>`.
