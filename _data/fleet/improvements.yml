  # --- loop-tuner 2026-08-10: recurring-rule parser was counting a PHANTOM rule --
  # loop_metrics' report_rules parsed any comment-table row with >=6 cells as a
  # finding, which ALSO matched aggregate.rb's 4-column info-summary table
  # (| count | check | rule | example |). Its header word `example` and its
  # example-location cells leaked in as lint rules — `example` surfaced as a
  # recurring finding on 3 PRs, a false signal that misdirects every future run.
  # Fixed at the source: require the 5-column finding shape (>=7 cells) so the
  # info table is excluded. Verified by two new self-test cases + the phantom
  # vanishing from this window's recurring_findings.
  - id: 2026-08-10-recurring-parser
    date: 2026-08-10
    pr: 444
    metric: recurring_findings
    baseline: 3
    direction: down
    status: pending
    note: >-
      Recurring lint rule `example` reported on 3 PRs was a MEASUREMENT artifact,
      not a real rule: report_rules matched aggregate.rb's 4-column info-summary
      table and read its header/example-location cells as rules. Tightened the row
      filter from `cells.size >= 6` to `>= 7` (the finding table has 5 columns / 7
      cells; the info table has 4 / 6) so only real finding rows are counted.
      Baseline = the phantom's pr-count (3); after the fix recurring_findings no
      longer contains `example` (this window: only `missing-preview` remains).
      Deterministic guard: loop_metrics self-test 27->29 (two report_rules cases).
      NB: verify_improvements can't dig an array metric, so it will read this as
      pending — the self-test is the standing verification.

