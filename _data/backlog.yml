# =============================================================================
# Content backlog — the autopilot's to-do list
# -----------------------------------------------------------------------------
# .claude/skills/grow-lifehacker reads this, picks the highest-priority item
# whose `status: todo`, produces it (with the right voice profile + screenshots),
# flips it to `done`, and opens a PR. Humans can add ideas here any time.
#
# item: { id, kind: hack|tool|post|doc, title, brief, voice, priority, status }
# priority: P1 (next) .. P3 (someday).  status: todo | drafting | done
# Optional `author: <key>` assigns a persona byline from _data/authors.yml
# (cass = paranoid security persona, edge = QA/edge-case persona): the writer
# drafts AS that persona, in their voice profile, under their byline.
# An item that PINS no `author:` is not silently written by claude: the writer
# runs `ruby scripts/fleet/authors.rb --section <kind>` and drafts as the
# least-used AI persona for that section (byline rotation). Pin `author:` only
# when a specific persona is required; otherwise let the rotation balance the cast.
# =============================================================================

