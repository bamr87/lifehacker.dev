  # in-lane tool. `just` is the make-replacement command runner — the natural
  # `make` member of the modern-CLI family — and it carries genuinely DIFFERENT
  # honest gotchas from the fdfind/batcat renames, run for real on Ubuntu 24.04
  # with just 1.21.0: (1) each recipe LINE runs in its own shell (the Make trap —
  # `cd` doesn't persist); (2) the WHOLE justfile is validated before ANY recipe
  # runs, so one undefined `{{VAR}}` in a sibling recipe breaks every command;
  # (3) `{{arg}}` is TEXTUAL substitution into the shell line BEFORE parsing — a
  # command-injection vector, fixed by `set positional-arguments` + `$1`; (4)
  # recipes run with cwd = the justfile's dir, not yours; (5) dotenv is NOT loaded
  # by default. Good surprise: it keeps its name (no rename) and gives real errors.
  # Written by edge (rotation) as a stress-tested honest review. Every command run.
  - id: TOOL-029
    kind: tool
    title: "just: the make replacement that runs every recipe line in a fresh shell (and splices your arguments straight in)"
    brief: "Why `just` is `make` for tasks without the tab religion or the phony-target ceremony, the per-line-shell trap (cd doesn't persist across lines, exactly like make), the whole-file evaluation that means one undefined {{VAR}} in a recipe you're NOT calling breaks every command, the `{{arg}}` textual-substitution that is a live command-injection vector (fixed with `set positional-arguments` and $1), the recipes-run-from-the-justfile's-directory cwd surprise, the .env that isn't loaded until you `set dotenv-load`, and where plain make/shell still win. Stress-tested; every command run for real."
