# =============================================================================
# top_story.yml — which post the homepage hero ("Top Story") features
# -----------------------------------------------------------------------------
# The homepage (index.md) reads `url:` and heroes the post whose site URL
# matches it exactly. The weekly-epic routine (.claude/skills/weekly-epic,
# weekly-epic.yml) points this at each new weekly epic when it opens its PR, so
# the Top Story rotates weekly THROUGH the normal human-reviewed content gate —
# editing this file is editing the front page.
#
# A human can point it anywhere, any time; the next epic run will point it back.
# If the URL matches nothing (typo, unpublished draft, deleted post), index.md
# falls back to the site's signature story, then to the newest post — the hero
# never renders empty.
