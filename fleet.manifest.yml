# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: bamr87/lifehacker.dev
provenance: derived
summary: An autonomous content fleet — scouts, wire desk, triage, weekly epic, and auto-fix lanes
  publishing a Jekyll site, every loop default-OFF behind its own *_ENABLED repo variable.
lanes:
- id: agent-review
  kind: review
  harness: claude-cli
  implementation: .github/workflows/agent-review.yml
  description: agent-review
  triggers:
  - kind: schedule
    cron: 17 5 1 * *
  - kind: dispatch
  switch: AGENT_REVIEW_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  guardrails:
    never_merges: true
- id: auto-fix
  kind: maintenance
  harness: claude-cli
  implementation: .github/workflows/auto-fix.yml
  description: auto-fix
  triggers:
  - kind: event
    events:
    - workflow_run
  switch: AUTO_FIX_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: brand-sweep
  kind: other
  harness: claude-cli
  implementation: .github/workflows/brand-sweep.yml
  description: brand-sweep
  triggers:
  - kind: schedule
    cron: 23 8 * * 1
  - kind: dispatch
  switch: BRAND_SWEEP_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  guardrails:
    never_merges: true
- id: claude
  kind: mention
  harness: claude-code-action
  implementation: .github/workflows/claude.yml
  description: Claude
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
    - pull_request_review
    - pull_request_review_comment
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: content-factory
  kind: content
  harness: claude-cli
  implementation: .github/workflows/content-factory.yml
  description: content-factory
  triggers:
  - kind: schedule
    cron: 0 9 * * *
  - kind: dispatch
  switch: CONTENT_FACTORY_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: content-scout
  kind: content
  harness: claude-cli
  implementation: .github/workflows/content-scout.yml
  description: content-scout
  triggers:
  - kind: schedule
    cron: 7 8 * * *
  - kind: dispatch
  switch: CONTENT_SCOUT_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  guardrails:
    never_merges: true
- id: devops-audit
  kind: analysis
  harness: claude-cli
  implementation: .github/workflows/devops-audit.yml
  description: devops-audit
  triggers:
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: explore
  kind: analysis
  harness: claude-cli
  implementation: .github/workflows/explore.yml
  description: explore
  triggers:
  - kind: schedule
    cron: 23 6 * * *
  - kind: dispatch
  switch: EXPLORER_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
- id: factory--issue-factory-1
  kind: triage
  harness: claude-code-action
  implementation: .github/workflows/factory--issue-factory-1.yml
  description: 'Factory: Issue Factory 1'
  triggers:
  - kind: dispatch
  switch: ISSUE_FACTORY_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: factory--issue-factory-2
  kind: triage
  harness: claude-code-action
  implementation: .github/workflows/factory--issue-factory-2.yml
  description: 'Factory: Issue Factory 2'
  triggers:
  - kind: dispatch
  switch: ISSUE_FACTORY_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
- id: fleet-dispatch
  kind: other
  harness: claude-cli
  implementation: .github/workflows/fleet-dispatch.yml
  description: fleet-dispatch
  triggers:
  - kind: schedule
    cron: 0 8 * * *
  - kind: dispatch
  switch: FLEET_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
