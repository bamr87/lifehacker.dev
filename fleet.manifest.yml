# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: bamr87/lifehacker.dev
provenance: derived
summary: An autonomous content fleet — scouts, wire desk, triage, and auto-fix lanes
  publishing a Jekyll site, every loop default-OFF behind its own *_ENABLED repo variable.
lanes:
- id: auto-fix
  kind: maintenance
  harness: claude-cli
  implementation: .github/workflows/auto-fix.yml
  description: auto-fix
  triggers:
  - kind: event
    events:
    - workflow_run
  switch: AUTO_FIX_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: claude
  kind: mention
  harness: claude-code-action
  implementation: .github/workflows/claude.yml
  description: Claude
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
    - pull_request_review
    - pull_request_review_comment
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: factory--issue-factory-1
  kind: triage
  harness: claude-code-action
  implementation: .github/workflows/factory--issue-factory-1.yml
  description: 'Factory: Issue Factory 1'
  triggers:
  - kind: dispatch
  switch: ISSUE_FACTORY_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: factory--issue-factory-2
  kind: triage
  harness: claude-code-action
  implementation: .github/workflows/factory--issue-factory-2.yml
  description: 'Factory: Issue Factory 2'
  triggers:
  - kind: dispatch
  switch: ISSUE_FACTORY_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
tokens:
- name: ANTHROPIC_API_KEY
  scope: fleet
  required: false
  purpose: Fallback Claude auth, used only when the OAuth token is absent.
  used_by:
  - auto-fix
  - claude
  - factory--issue-factory-1
  - factory--issue-factory-2
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: 'Preferred Claude auth (house convention: OAuth first). Produced by `claude setup-token`.'
  used_by:
  - auto-fix
  - claude
  - factory--issue-factory-1
  - factory--issue-factory-2
- name: FLEET_TOKEN
  scope: fleet
  required: true
  purpose: 'Cross-repo PAT: lets a lane see and act on other repositories.'
  used_by:
  - auto-fix
agents:
- agent-reviewer
- author-cass
- author-edge
- author-rhea
- brand-fixer
- brand-reviewer
- content-reviewer
- content-scout
- devops-manager
- fleet-bugfix
- grow-lifehacker
- loop-tuner
- quest-forge
- session-retrospective
- site-explorer
- theme-scout
- triage-lifehacker
- weekly-epic
- wire-scout
skills:
- _shared
- agent-skill-review
- content-import
- content-reviewer
- content-scout
- devops-manager
- fleet-bugfix
- grow-lifehacker
- loop-tuner
- quest-forge
- session-retrospective
- site-explorer
- test-lifehacker
- theme-scout
- triage-lifehacker
- weekly-epic
- wire-scout
