name: Deploy chat proxy

permissions:
  contents: read

concurrency:
  group: deploy-chat-proxy
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
    paths:
      - 'templates/deploy/chat-proxy/worker.js'
      - 'templates/deploy/chat-proxy/wrangler.toml'
      - '.github/workflows/deploy-chat-proxy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The AI-chat widget is disabled by default (see _config.yml), so most
      # plantings never add the Cloudflare secrets. Skip with a notice instead
      # of failing main when they are missing.
      - name: Check Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Chat proxy not deployed::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set, so the Worker deploy was skipped. Add them as repo secrets to deploy."
          fi

      # Deploys the AI chat proxy Worker to Cloudflare.
      # Required GitHub Actions secrets:
      #   CLOUDFLARE_API_TOKEN   - token with "Edit Cloudflare Workers" permission
      #   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
      # Optional (proxy-mode issue/PR creation): add GITHUB_TOKEN to a
      # `secrets:` list below and a CHAT_GITHUB_TOKEN repo secret mapped in env.
      #
      # ANTHROPIC_API_KEY disabled for now (2026-11-15): Claude auth across the
      # fleet is OAuth only, and the Worker calls the Anthropic API directly, so it
      # cannot use CLAUDE_CODE_OAUTH_TOKEN. The deploy no longer ships the key —
      # the Worker keeps whatever ANTHROPIC_API_KEY secret it already has in
      # Cloudflare (none on a first deploy, so chat calls would fail). To restore,
      # re-add to the step below:
      #     secrets: |
      #       ANTHROPIC_API_KEY
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Deploy Worker to Cloudflare
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: templates/deploy/chat-proxy
          wranglerVersion: '3'
