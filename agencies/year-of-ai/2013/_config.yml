# =============================================================================
# 2013 — GitHub Pages configuration (zer0-mistakes org hub scaffold)
# =============================================================================
# Generated by zer0-mistakes/scripts/provision-org-sites.rb from
# templates/org-site/_config.yml.template — re-run the provisioner to update.
#
# Publishing: GitHub Pages, "deploy from branch" (main, path /).
# Site URL:   https://year-of-ai.github.io/2013/
# Theme:      remote_theme bamr87/zer0-mistakes@v1.26.0 (no theme files vendored here).
#
# Content stays plain markdown in this repo. The GitHub Pages default plugins
# (optional-front-matter, readme-index, default-layout, titles-from-headings,
# relative-links) turn it into pages without any front-matter requirements.
# =============================================================================

site_configured: true

title: "2013"
description: "self-growing knowledge base — the year 2013"

github_user: "year-of-ai"
repository_name: "2013"
repository: "year-of-ai/2013"

url: "https://year-of-ai.github.io"
baseurl: "/2013"
remote_theme: "bamr87/zer0-mistakes"

markdown: kramdown
kramdown:
  input: GFM
permalink: pretty
teaser: /images/previews/default.svg
og_image: /images/previews/default.svg

# Masthead brand mark. Unset, the theme's header renders an <img> with an
# empty src, which relative_url resolves to the baseurl itself — a broken
# image on every page.
logo: /assets/images/favicon.svg

# Browser identity. The theme's core/favicon.html always emits the `ico`
# link and assumes the site carries a favicon at its root; remote_theme
# ships only _layouts/_includes/_sass/assets, so the theme's own never
# arrives. Assets minted by the hub's scripts/generate-favicon.rb.
favicon:
  ico: /favicon.ico
  svg: /assets/images/favicon.svg


# GitHub Pages enables all of these by default; listing them keeps local
# builds (github-pages gem) identical to production.
#
# jekyll-include-cache is REQUIRED: the remote theme's layouts use the
# {% include_cached %} tag (e.g. _includes/components/setup-banner.html), and
# the consuming site must load the plugin that provides it or the build fails
# with "Unknown tag 'include_cached'". It is on the GitHub Pages whitelist.
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings

# Markdown files without front matter become pages (don't also copy the raw
# .md into the output).
optional_front_matter:
  remove_originals: true

# Relative .md links between files rewrite to the rendered page URLs.
relative_links:
  enabled: true

# Pages without an explicit title take it from their first heading. The body
# H1 stays in place (see hide_intro below), so don't strip it.
titles_from_headings:
  enabled: true
  strip_title: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      # The article layout renders the top-of-page hero from page.preview
      # only for featured/breaking posts unless a post opts in. Every
      # article here carries a preview, so opt the collection in; the
      # layout still guards on page.preview.
      show_hero: true
      author_profile: false
      read_time: true
      share: true
      comments: false
      related: true
  - scope:
      path: ""
    values:
      layout: default
      # Content files carry their own H1; skip the theme's intro header so
      # the heading doesn't render twice.
      hide_intro: true
      author_profile: false
      read_time: true
      share: true
      sidebar:
        nav: main

# Repo/agent plumbing that must not publish as site pages.
#
# NOTE: seed.md and ROADMAP.md are intentionally NOT excluded — the repo README
# (the site homepage via jekyll-readme-index) links to seed.md, and seed.md
# links to ROADMAP.md. Excluding them leaves those relative links un-rewritten
# by jekyll-relative-links, producing 404s on every homepage. Publishing them
# (at /seed/ and /roadmap/) lets the links resolve. They are still kept out of
# the navbar via _data/hub.yml `defaults.exclude` in the theme repo.
exclude:
  - PRD.md
  - CLAUDE.md
  - AGENTS.md
  - LIFECYCLE.md
  - lifecycle.yml
  - seed-package/
  - telemetry/
  - .claude/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - docs/constitution.md
  - docs/amendments/
  - features/
