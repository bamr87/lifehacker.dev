<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 418" width="760" height="418" role="img" aria-label="forge tab completion with tips">
<rect width="760" height="418" rx="12" fill="#05070d"/>
<rect width="760" height="36" rx="12" fill="#0b1020"/>
<rect y="24" width="760" height="12" fill="#0b1020"/>
<circle cx="22" cy="18" r="6" fill="#ff5f56"/>
<circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
<circle cx="62" cy="18" r="6" fill="#27c93f"/>
<text x="380.0" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7f9ab8">zsh — forge &lt;Tab&gt;</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
<text x="22" y="64" fill="#eaf6ff" font-weight="600">$ forge ▊</text>
<rect x="16" y="78" width="728" height="320" rx="8" fill="#0b1020" stroke="#1b2b44" stroke-width="1"/>
<text x="28" y="98" fill="#7f9ab8" font-weight="400">[forge command]</text>
<rect x="22" y="104" width="716" height="20" rx="4" fill="#12303a"/>
<text x="30" y="118" fill="#22d3ee" font-weight="700">❯</text>
<text x="48" y="118" fill="#22d3ee" font-weight="700">console</text>
<text x="160" y="118" fill="#7f9ab8" font-weight="400">—  join the console tmux session</text>
<text x="48" y="140" fill="#eaf6ff" font-weight="400">shell</text>
<text x="160" y="140" fill="#7f9ab8" font-weight="400">—  private zsh on forge, outside tmux</text>
<text x="48" y="162" fill="#eaf6ff" font-weight="400">wake</text>
<text x="160" y="162" fill="#7f9ab8" font-weight="400">—  power on (Wake-on-LAN)</text>
<text x="48" y="184" fill="#eaf6ff" font-weight="400">status</text>
<text x="160" y="184" fill="#7f9ab8" font-weight="400">—  reachability + health</text>
<text x="48" y="206" fill="#eaf6ff" font-weight="400">ps</text>
<text x="160" y="206" fill="#7f9ab8" font-weight="400">—  visual container status</text>
<text x="48" y="228" fill="#eaf6ff" font-weight="400">sh</text>
<text x="160" y="228" fill="#7f9ab8" font-weight="400">—  shell into a container</text>
<text x="48" y="250" fill="#eaf6ff" font-weight="400">logs</text>
<text x="160" y="250" fill="#7f9ab8" font-weight="400">—  follow container logs</text>
<text x="48" y="272" fill="#eaf6ff" font-weight="400">restart</text>
<text x="160" y="272" fill="#7f9ab8" font-weight="400">—  restart a container</text>
<text x="48" y="294" fill="#eaf6ff" font-weight="400">stacks</text>
<text x="160" y="294" fill="#7f9ab8" font-weight="400">—  compose projects on the box</text>
<text x="48" y="316" fill="#eaf6ff" font-weight="400">compose</text>
<text x="160" y="316" fill="#7f9ab8" font-weight="400">—  docker compose in ~/dev/&lt;proj&gt;</text>
<text x="48" y="338" fill="#eaf6ff" font-weight="400">health</text>
<text x="160" y="338" fill="#7f9ab8" font-weight="400">—  forge-health checks</text>
<text x="48" y="360" fill="#eaf6ff" font-weight="400">ui</text>
<text x="160" y="360" fill="#7f9ab8" font-weight="400">—  open grafana/portainer/adminer/site/glances</text>
<text x="48" y="382" fill="#eaf6ff" font-weight="400">help</text>
<text x="160" y="382" fill="#7f9ab8" font-weight="400">—  this list</text>
</g></svg>
