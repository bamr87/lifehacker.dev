# =============================================================================
# zer0-doctor.yml — the zer0 stack consumer contract check (report-only)
# -----------------------------------------------------------------------------
# A thin caller of zer0-CMS's reusable doctor: is this site still aligned with
# the zer0 stack — the zer0-mistakes theme, the zer0-image-generator gem and its
# `preview_images:` block, a valid zer0.json, a strict fleet.manifest.yml, and
# front matter the theme's schema accepts? Findings use this repo's
# findings.jsonl shape, but this is NOT a harness check: it never runs on a pull
# request, never gates `verify`, and fail-on-error stays false.
#
# Deliberately schedule + dispatch only. Until bamr87/zer0-CMS ships the
# reusable workflow on main this caller has nothing to call, and a PR trigger
# would redden every PR in the meantime.
#
# Makes zero model calls, so it needs no *_ENABLED switch and no
# fleet.manifest.yml lane (like nightly.yml and ci.yml).
#
# No timeout-minutes here: GitHub rejects that key on a job that calls a
# reusable workflow; the called workflow's own jobs carry the timeout.
#
# Locally, from a zer0-CMS checkout:
#   ruby -I rails/lib rails/bin/zer0-cms doctor /path/to/lifehacker.dev
# =============================================================================
name: zer0-doctor

on:
  schedule:
    - cron: '37 5 * * 2'   # Tue 05:37 UTC weekly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zer0-doctor
  cancel-in-progress: true

jobs:
  doctor:
    uses: bamr87/zer0-CMS/.github/workflows/zer0-doctor.yml@main
    with:
      fail-on-error: false
