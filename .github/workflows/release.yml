name: Release

# kit: sdlc v0.1.0 — thin caller of the fleet's ONE release-please
# workflow (decision D5: every repo, content included, has a CHANGELOG.md that
# release-please writes). Needs release-please-config.json and
# .release-please-manifest.json at the repo root (templates/sdlc/release/ in
# bamr87/bamr87 has one config per release type). Don't edit the logic here.
#
# Pinned to the floating major tag, never a branch (UPS-WORK-10). The
# RELEASE_PLEASE_TOKEN secret lets the release PR's commits trigger CI, and is
# what the preflight gate below looks for: without it (and without the repo
# setting that lets GITHUB_TOKEN open PRs) no release PR can be opened at all.
# A repo that publishes to a registry chains its publish job off
# `needs.release.outputs.release_created` below this one.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # release-please cannot open its release PR on a repo that has neither a
  # RELEASE_PLEASE_TOKEN secret nor the Actions setting that lets GITHUB_TOKEN
  # open pull requests. It computes the release, updates its release branch, and
  # then exits 1 on `POST /pulls` with "GitHub Actions is not permitted to
  # create or approve pull requests" — on every push, indefinitely, with nothing
  # else about the run wrong (bamr87/bamr87#406, #424).
  #
  # So ask first. A missing credential becomes a clean skip with a warning that
  # says what to provision, instead of a red run per push. This gate is
  # self-healing: the moment RELEASE_PLEASE_TOKEN exists here, the next push
  # releases, with no change to this file.
  #
  # Remove this job and the `needs:`/`if:` below once the hub's `v2` tag carries
  # bamr87/bamr87#437, which guards the same denial inside the reusable workflow
  # itself. A manual dispatch bypasses the gate — that is how to run a release
  # if the other remedy (the Actions setting) is chosen instead of the PAT.
  preflight:
    name: Release credential present?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      armed: ${{ steps.probe.outputs.armed }}
    steps:
      - id: probe
        env:
          # A comparison, never the value: this prints true or false.
          ARMED: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "armed=$ARMED" >> "$GITHUB_OUTPUT"
          if [ "$ARMED" = "true" ]; then
            echo "RELEASE_PLEASE_TOKEN is present — running release-please."
            exit 0
          fi
          echo "::warning title=Release paused::No RELEASE_PLEASE_TOKEN on $GITHUB_REPOSITORY, and GITHUB_TOKEN may not open pull requests, so release-please cannot open its release PR. Skipping instead of failing; nothing is lost."
          {
            echo "### Release skipped — no credential to open the release PR"
            echo
            echo "Either of these starts releases again, and the next push to the default branch opens the PR:"
            echo
            echo "1. A \`RELEASE_PLEASE_TOKEN\` secret here — a PAT with \`contents: write\` + \`pull requests: write\`. Preferred: the release PR then runs CI, and this gate opens on its own."
            echo "2. Settings > Actions > General > Workflow permissions > \"Allow GitHub Actions to create and approve pull requests\". Then run this workflow from the Actions tab (a manual dispatch bypasses this gate), and drop the gate."
            echo
            echo "Tracked in [bamr87/bamr87#406](https://github.com/bamr87/bamr87/issues/406)."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: preflight
    if: needs.preflight.outputs.armed == 'true' || github.event_name == 'workflow_dispatch'
    uses: bamr87/bamr87/.github/workflows/release-please.yml@v2
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
