# =============================================================================
# auto-merge.yml — merge green BOT PRs automatically (gated, narrowly scoped)
# -----------------------------------------------------------------------------
# When AUTO_MERGE_ENABLED is on, this merges bot-authored PRs that have passed
# the entire gate — and ONLY two flavors of them:
#   * content PRs   (label auto:content)      — diff must be content/data only
#   * triage PRs    (label source/triage-bot) — diff must be generated DATA only
#     (_data/health, SITE_HEALTH.md, _data/analytics — the queue + dashboard
#     refresh; one content line in the diff and it goes back to a human)
# The load-bearing safety is the SMUGGLE GUARD: it re-classifies EACH changed
# file on its own and refuses to merge anything outside content and data, even
# if the PR is labeled content. So a content PR can never sneak a workflow,
# script, _config, Gemfile, agency, doc or catalog change past review (a lone
# unclassified file classifies as pipeline). Those PRs always wait for a human.
# It merges with a merge commit (bamr87/bamr87 constitution § 12.2).
#
# Behind the AUTO_MERGE_ENABLED repo variable, ON since 2026-11-25 (hub
# amendment `lifehacker-auto-merge`, this repo's amendment 0005). Enabling it
# retires the human review of *content* and *triage data* (only) — recorded in
# /about/colophon/. Setting it to false returns every merge to a human.
# =============================================================================
name: auto-merge

on:
  workflow_run:
    workflows: [pipeline]
    types: [completed]
  schedule:
    # Backstop sweep only. The workflow_run trigger above already fires at every
    # moment a PR can newly turn green (pipeline completion), so a */30 cron was
    # ≥85% no-op (~250 runs/5 days for ~6 bot PRs/day). 6/day catches stragglers.
    - cron: '13 6 * * *'  # daily backstop (was every 4h); workflow_run covers real events
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  sweep:
    # Kill switch at the job level: with AUTO_MERGE_ENABLED off, the pipeline-completion
    # and backstop-cron runs skip this job (no runner, no billed minute). A manual
    # dispatch still reaches the Gate step below, which keeps the final say.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_MERGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Gate FIRST — before checkout (fetch-depth:0) + Ruby. When the kill switch
      # is off, a sweep should cost seconds, not a full checkout + toolchain.
      - name: Gate
        id: gate
        env:
          ENABLED: ${{ vars.AUTO_MERGE_ENABLED }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "AUTO_MERGE_ENABLED != true — auto-merge is OFF. Nothing merged."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: ${{ steps.gate.outputs.go == 'true' }}
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        if: ${{ steps.gate.outputs.go == 'true' }}
        with:
          ruby-version: '3.3'
      - name: Merge eligible content PRs
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: |
          set -u
          merged=0; declined=0; skipped=0
          # Candidates: open PRs labeled auto:content (content factory et al.),
          # source/triage-bot (queue + dashboard refreshes), or
          # source/ai-usage-bot (AI cost ledger sweeps), NOT needs-human. Both
          # bot-data flavors are held to the same pure-data bar below.
          # Draft PRs are never candidates (a draft is by definition not ready).
          prs=$(gh pr list --state open \
                 --json number,labels,isDraft \
                 --jq '.[] | select(.isDraft | not) | [.labels[].name] as $l
                       | select(($l | index("needs-human") | not)
                                and ($l | any(. == "auto:content" or . == "source/triage-bot" or . == "source/ai-usage-bot")))
                       | "\(.number) \(if $l | index("source/triage-bot") then "triage" elif $l | index("source/ai-usage-bot") then "ai-usage" else "content" end)"')
          while read -r pr flavor; do
            [ -n "$pr" ] || continue
            echo "::group::PR #$pr ($flavor)"

            # The head this sweep judges; the merge below is pinned to it, so a
            # push after the guard ran can never be merged unseen.
            head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)

            # 1. SMUGGLE GUARD — every changed file must be content or data.
            # Each file is classified ON ITS OWN: the classifier reports a mixed
            # diff by its classified kinds only, so `pages/` + `agencies/` would
            # read as plain content, while a lone unclassified file reads as
            # `pipeline` (its fail-safe) and is declined here.
            kinds=$(gh pr diff "$pr" --name-only | while IFS= read -r f || [ -n "$f" ]; do
                      [ -n "$f" ] && printf '%s\n' "$f" | ruby scripts/ci/classify_changes.rb
                    done | tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd' ' -)
            [ -n "$kinds" ] || kinds=pipeline   # an empty or unreadable diff is never merged
            if echo "$kinds" | grep -qiE 'deps|pipeline'; then
              echo "DECLINE #$pr: diff touches files outside content and data ($kinds) — always human-gated."
              gh pr edit "$pr" --add-label needs-human || true
              gh pr comment "$pr" --body "Auto-merge declined: this PR changes files outside content and data (\`$kinds\`: build, pipeline, agency, doc or catalog files), which require human review. Labeled \`needs-human\`." || true
              declined=$((declined+1)); echo "::endgroup::"; continue
            fi

            # 1b. Bot data refreshes (triage queue, ai-usage ledger) are held to
            # a TIGHTER bar: generated data only. A data bot has no business
            # editing content.
            if { [ "$flavor" = "triage" ] || [ "$flavor" = "ai-usage" ]; } && [ "$kinds" != "data" ]; then
              echo "DECLINE #$pr: $flavor PR classifies as '$kinds', not pure data — human-gated."
              gh pr edit "$pr" --add-label needs-human || true
              gh pr comment "$pr" --body "Auto-merge declined: a $flavor PR should only touch generated data, but this diff classifies as \`$kinds\`. Labeled \`needs-human\`." || true
              declined=$((declined+1)); echo "::endgroup::"; continue
            fi

            # 2. All checks green? gh pr checks exits 0 only when EVERY check
            # passes, a superset of the required ones. (Not `--required`: it
            # exits non-zero when a branch has no required checks configured.)
            if ! gh pr checks "$pr" >/dev/null 2>&1; then
              echo "SKIP #$pr: checks not all green yet."
              skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi

            # 2b. Re-check draft state right before merging: the list above can be
            # minutes old, and a PR may have been converted back to draft since.
            if [ "$(gh pr view "$pr" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "SKIP #$pr: draft PR."
              skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi

            # 3. Mergeable (no conflicts)?
            if [ "$(gh pr view "$pr" --json mergeable --jq .mergeable)" != "MERGEABLE" ]; then
              echo "SKIP #$pr: not mergeable."
              skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi

            echo "MERGE #$pr: $flavor-only, green, mergeable -> merging (merge commit, head $head)."
            if gh pr merge "$pr" --merge --match-head-commit "$head" --delete-branch; then merged=$((merged+1)); else
              echo "merge failed for #$pr"; skipped=$((skipped+1)); fi
            echo "::endgroup::"
          done <<< "$prs"
          { echo "## Auto-merge sweep"; echo "merged: $merged · declined (needs-human): $declined · skipped: $skipped"; } >> "$GITHUB_STEP_SUMMARY"
