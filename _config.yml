# =============================================================================
# lifehacker.dev — site configuration
# -----------------------------------------------------------------------------
# A Jekyll site rendered by the `bamr87/zer0-mistakes` remote theme and served
# by GitHub Pages at the apex domain lifehacker.dev.
#
# IMPORTANT (remote-theme rule): `remote_theme` only delivers the theme's
# _layouts/, _includes/, _sass/, and assets/. It does NOT deliver the theme's
# _config.yml, _data/, or _plugins/. So every structural block below
# (collections, defaults, appearance, nav wiring) is authored here on purpose,
# and the _data/ this site needs is committed in this repo. See docs/journey/.
# =============================================================================

# ── Setup flag ───────────────────────────────────────────────────────────────
# `false` shows the theme's onboarding wizard on the home page. We are
# configured, so this is true — the wizard is gone and our real site renders.
site_configured          : true

# ── Site identity ────────────────────────────────────────────────────────────
title                    : &title "Lifehacker.dev"
title_url                : "/"
title_icon               : "robot"
subtitle                 : "Surviving life, one byte at a time."
subtitle_icon            : "terminal"
title_separator          : "|"
description              : "Knowledge, tools, and comedy for getting through life one byte at a time."
locale                   : "en-US"
level                    : "n00b"

# ── Owner / founder ──────────────────────────────────────────────────────────
founder                  : "Amr Abdel-Motaleb"
name                     : &name "Amr"
email                    : "hello@lifehacker.dev"

# ── GitHub coordinates ───────────────────────────────────────────────────────
github_user              : &github_user "bamr87"
repository_name          : &repository_name "lifehacker.dev"
repository               : [*github_user, "/", *repository_name]
branch                   : "main"
remote_theme             : "bamr87/zer0-mistakes"

# ── URLs & deployment (custom apex domain) ───────────────────────────────────
url                      : "https://lifehacker.dev"
baseurl                  : ""
logo                     : /assets/images/logo.svg
logo_link                : "/"
og_image                 : /assets/images/og-banner.svg
teaser                   : /assets/images/og-banner.svg

# Favicon / browser identity — rendered by the theme's core/favicon.html.
# favicon.svg is the favicon-optimized cut of logo.svg (no glow, heavier
# strokes); favicon.ico (16/32/48) + apple-touch-icon.png are rasters of it.
favicon:
  ico                    : /favicon.ico
  svg                    : /assets/images/favicon.svg
  apple_touch            : /assets/images/apple-touch-icon.png
  theme_color            : "#0b0f17"   # address-bar chrome matches the site bg, not neon

# ── Read-time / chrome ───────────────────────────────────────────────────────
words_per_minute         : 200
breadcrumbs              : true
repo_map                 : "/sitemap/"
# -----------------------------------------------------------------------------
# Preview banners — the "Trace Bloom" generative framework.
#   docs/PREVIEW-IMAGES.md (how it works) · docs/TRACE-BLOOM.md (the philosophy)
#
# The art is COMPUTED from each article (seeded by its slug), not fetched from a
# render API and not stamped from a template: no gem, no API key, no rasterizer,
# no network. Design tokens — palettes, type scale, safe band, the closed
# parameter space — live in _data/preview/design.json, which is the one file to
# edit to re-skin the site. Regenerate with:
#
#     node scripts/preview/generate.mjs --all
#
# Kept here only for Jekyll/Liquid consumers that read site.preview_images.
# -----------------------------------------------------------------------------
preview_images:
  enabled                  : true
  generator                : 'trace-bloom'
  tokens                   : '_data/preview/design.json'
  output_dir               : 'assets/images/previews'
  assets_prefix            : '/assets'
  front_matter_key         : 'preview'
  collections:
    - posts
    - docs
# ── Appearance: skin + palette + backgrounds ─────────────────────────────────
# Skins: air, aqua, dirt, neon, mint, plum, sunrise. `neon` gives lifehacker
# its late-night-terminal, infomercial-after-dark energy.
theme_skin               : "neon"

# Compile-time overrides of the --zer0-color-* tokens (tokens-inline.html).
# Hex codes MUST be quoted (unquoted #abc is parsed as a YAML comment → null).
theme_color:
  main:         "#d946ef"   # neon fuchsia (primary)
  secondary:    "#64748b"
  red:          "#ef4444"
  yellow:       "#facc15"
  teal:         "#22d3ee"
  blue:         "#22d3ee"   # links → neon cyan
  green:        "#22c55e"
  purple:       "#a855f7"
  pink:         "#ec4899"
  orange:       "#fb923c"
  cyan:         "#22d3ee"
  indigo:       "#6366f1"

# SVG background layers (gradient / pattern / noise per skin).
theme_background:
  enabled                : true
  gradient_opacity       : 0.6
  texture_opacity        : 0.04
  pattern_opacity        : 0.08
  blend_mode             : overlay

# Runtime light/dark/auto + primary-color picker in the Settings offcanvas.
appearance_panel         : true

# Page-load progress bar.
nanobar:
  enabled                : true
  color                  : "var(--bs-primary)"
  background             : "transparent"
  height                 : "3px"
  position               : "navbar"
  steps                  : [20, 55, 85, 100]
  step_delay_ms          : 120

# ── Analytics & comments — OFF until lifehacker.dev supplies its own ──────────
# (The theme's own _config ships these "on" with the author's keys; a remote
# consumer must NOT inherit those. We define them here, disabled, ready to wire.)
google_analytics         : null
posthog:
  enabled                : false
ai_chat:
  enabled                : false
# Giscus comments (the upstream `gisgus:` typo this note used to flag has been
# fixed — the theme reads `giscus:`). Flip `enabled` once a Giscus repo is connected.
giscus:
  enabled                : false

# Search-engine verification (add when you have them).
google_site_verification : null
bing_site_verification   : null

# ── Social / affiliations ────────────────────────────────────────────────────
default_icon: "bi"
links:
  - label: "GitHub"
    icon: "bi-github"
    url: "https://github.com/bamr87/lifehacker.dev"
  - label: "Theme"
    icon: "bi-palette"
    url: "https://github.com/bamr87/zer0-mistakes"
  - label: "IT-Journey"
    icon: "bi-signpost-split"
    url: "https://it-journey.dev"

# ── Author identity (for SEO + author cards) ─────────────────────────────────
author:
  name                   : *name
  avatar                 : "/assets/images/logo.svg"
  bio                    : "Builder of lifehacker.dev. Lets a robot do the typing."
  location               : "The Internet"
  github_username        : *github_user

# ── Build framework badge (footer "Powered by") ──────────────────────────────
powered_by:
  - name: "Jekyll"
    url: "https://jekyllrb.com/"
    icon: "bi-joystick"
  - name: "Bootstrap"
    version: "5.3"
    url: "https://getbootstrap.com/"
    icon: "bi-bootstrap"
  - name: "GitHub Pages"
    url: "https://pages.github.com/"
    icon: "bi-github"
  - name: "Claude Code"
    url: "https://claude.com/claude-code"
    icon: "bi-robot"

# ── Plugins (all on the GitHub Pages whitelist) ──────────────────────────────
# jekyll-include-cache is REQUIRED: the theme's layouts use {% include_cached %}
# and remote_theme does not enable plugins for you (this is the classic first
# build failure — see docs/journey/). jekyll-mermaid is intentionally absent:
# it is NOT whitelisted and the theme renders Mermaid client-side anyway.
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-relative-links
  - jekyll-redirect-from

# In-content .md links inside collections must be rewritten or they 404.
# `collections: true` is the gotcha it-journey documents — keep it.
relative_links:
  enabled                : true
  collections            : true

# ── Markdown ─────────────────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  toc_levels: 1..6

# ── Sass ─────────────────────────────────────────────────────────────────────
sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never

# ── Collections ──────────────────────────────────────────────────────────────
# Collections live under pages/ (so files are pages/_posts, pages/_docs, ...).
# The former `hacks` and `tools` collections were folded into `posts` as news
# sections under pages/_posts/<section>/ (issue #337); each item pins an explicit
# permalink to its old /hacks/:slug/ or /tools/:slug/ URL, so nothing 404s.
collections_dir: pages
collections:
  pages:
    output: true
    permalink: /:name/
  posts:
    output: true
    permalink: /posts/:year/:month/:day/:title/
  about:
    output: true
    permalink: /about/:name/
  docs:
    output: true
    permalink: /docs/:name/

permalink: pretty

# ── Feed ─────────────────────────────────────────────────────────────────────
# RSS is the site's ONLY subscription channel (the hero CTA on index.md says
# so), yet jekyll-feed defaults posts_limit to 10 — which silently dropped
# ~190 of ~200 posts from /feed.xml. Diagnosed in the 2026-07-16 field note
# "The Feed That Forgot Ninety Posts"; fixed here. Keep this above the post
# count or the feed forgets again.
feed:
  posts_limit: 500

# ── Front-matter defaults (the cascade the theme expects) ────────────────────
# PREVIEW FALLBACK: every scope below carries a `preview:`, so a page whose own
# front matter omits the key still renders a banner on its card, its og:image
# and its article header. Front matter always wins — Jekyll's defaults are the
# LOWER-precedence side of the merge — so this never overrides generated art; it
# only fills the hole. Values use the prefix-less form the generator writes
# (`/images/...`), which the theme's preview-image include re-prefixes with
# `assets_prefix`. Scopes run least- to most-specific, so the section entries
# below win over the `pages/_posts` one.
#
# Covers BOTH holes: a `preview:` key that is omitted entirely AND one written
# with a null/empty value. Jekyll's deep-merge treats an explicit nil as absent
# for this purpose, so `preview:` with nothing after it resolves to the section
# banner exactly like a missing key does. Verified against the real config with
# probe documents, not assumed.
defaults:
  # Site-wide baseline.
  - scope:
      path: ""
    values:
      layout: default
      preview: /images/previews/section-posts.svg
      author: claude
      read_time: true
      share: true
      related: true
      comments: false
      sidebar:
        nav: auto
  # Top-level pages → main navbar sidebar.
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      sidebar:
        nav: main
  # News content — hacks, tools, field notes, and wire dispatches all live
  # under pages/_posts/<section>/ now, so one posts default gives them all the
  # `article` layout and the posts sidebar. Section-specific chrome comes from
  # each post's `categories` (Hacks / Tools / Field Notes / The Wire), not a scope.
  - scope:
      path: pages/_posts
    values:
      layout: article
      preview: /images/previews/section-posts.svg
      post_type: standard
      author_profile: true
      sidebar:
        nav: posts
  # Per-section banner fallbacks. More specific than `pages/_posts` above, so
  # a hacks post with no `preview:` gets the hacks banner, not the generic one.
  - scope:
      path: pages/_posts/hacks
    values:
      preview: /images/previews/section-hacks.svg
  - scope:
      path: pages/_posts/tools
    values:
      preview: /images/previews/section-tools.svg
  - scope:
      path: pages/_posts/field-notes
    values:
      preview: /images/previews/section-field-notes.svg
  - scope:
      path: pages/_posts/wire
    values:
      preview: /images/previews/section-wire.svg
  # About pages.
  - scope:
      path: pages/_about
    values:
      layout: default
      preview: /images/previews/section-posts.svg
      collection: about
      sidebar:
        nav: main
  # Docs.
  - scope:
      path: pages/_docs
    values:
      layout: default
      preview: /images/previews/section-docs.svg
      collection: docs
      sidebar:
        nav: auto

# ── Copyright ────────────────────────────────────────────────────────────────
cr_year: 2026
cr_entity: *title
cr_lisense: "MIT"

# ── Sitemap ──────────────────────────────────────────────────────────────────
sitemap_include: ["html", "xml"]

# ── Exclude from the build ───────────────────────────────────────────────────
# docs/ holds this repo's own setup tutorial + journey log, whose Markdown
# contains literal {% include_cached %} examples; keep it out of the build so
# Jekyll doesn't try to execute them. AGENTS.md / CLAUDE.md are operator maps
# with the same problem (literal ${{ secrets.* }}). Setting exclude replaces
# Jekyll's default list, so the usual build files are re-listed here.
exclude:
  - docs
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - _config_dev.yml
  - docker-compose.yml
  - fleet.manifest.yml
  - docker
  - README.md
  - AUTOPILOT.md
  - AGENTS.md
  - CLAUDE.md
  - .claude
  - scripts
  - node_modules
  - mcp
